project_id = "cmusntqsaatsxndltdxe"

[db]
major_version = 17

[auth]
enabled = true
site_url = "https://korama.vercel.app"
additional_redirect_urls = [
  "https://korama.vercel.app/auth/callback",
  "http://localhost:3000/auth/callback",
]

# Google sign-in. Credentials come from the Google Cloud OAuth client and are
# read from the environment at `supabase config push` time — never committed.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[storage]
enabled = true

[storage.buckets.rgd-certs]
public = false
file_size_limit = "10MiB"
